name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # /new-app adds one filter per app: <name>: ['apps/<name>/**', 'shared/**', '.github/workflows/ci.yml']
          filters: |
            ci:
              - '.github/workflows/ci.yml'

  # /new-app adds one job per app here, gated on needs.changes.outputs.apps.

  ci-ok:
    # The single required check. Passes when every app job succeeded or was skipped.
    if: always()
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
