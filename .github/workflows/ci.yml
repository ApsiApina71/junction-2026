name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.changes }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          # /new-app adds one filter per app: <name>: ['apps/<name>/**', 'shared/**', '.github/workflows/ci.yml']
          filters: |
            ci:
              - '.github/workflows/ci.yml'
            owl-api: ['apps/owl-api/**', 'shared/**', '.github/workflows/ci.yml']
            owl-site: ['apps/owl-site/**', 'shared/**', '.github/workflows/ci.yml']
            owl-studio: ['apps/owl-studio/**', 'shared/**', '.github/workflows/ci.yml']

  # /new-app adds one job per app here, gated on needs.changes.outputs.apps.

  owl-api:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'owl-api')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owl-api
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
          working-directory: apps/owl-api
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  owl-site:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'owl-site')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owl-site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/owl-site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  owl-studio:
    needs: changes
    if: contains(fromJSON(needs.changes.outputs.apps), 'owl-studio')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/owl-studio
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/owl-studio/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  ci-ok:
    # The single required check. Passes when every app job succeeded or was skipped.
    if: always()
    needs: [changes, owl-api, owl-site, owl-studio]
    runs-on: ubuntu-latest
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: echo "$NEEDS" | jq -e 'all(.[]; .result == "success" or .result == "skipped")'
