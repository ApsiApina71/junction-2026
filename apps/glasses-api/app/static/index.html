<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Glasses calorie tracker</title>
<style>
:root {
  --ground: #f6f6f4; --surface: #ffffff; --ink: #141413; --muted: #66665f; --line: #e2e2dd;
  --accent: #1f6f4a; --on-accent: #ffffff; --accent-soft: #e3f1ea; --danger: #b3261e;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #121211; --surface: #1c1c1a; --ink: #f2f2ee; --muted: #a3a39c; --line: #30302d;
    --accent: #5fc793; --on-accent: #0c2218; --accent-soft: #1d3329; --danger: #f2857d;
  }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--ground); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
main { max-width: 560px; margin: 0 auto; padding: 24px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
h1 { font-size: 14px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); margin: 0; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
.total { font-size: 56px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.total small { font-size: 18px; font-weight: 500; color: var(--muted); margin-left: 6px; }
.macros { display: flex; gap: 16px; margin-top: 12px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--line); margin-top: 12px; overflow: hidden; }
.bar > div { height: 100%; background: var(--accent); width: 0; }
video { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: #000; display: none; margin-bottom: 12px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button, .file { min-height: 44px; padding: 0 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font: inherit; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; }
button.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
.file input { display: none; }
label.check { display: inline-flex; align-items: center; gap: 8px; min-height: 44px; color: var(--muted); font-size: 14px; }
#status { margin: 12px 0 0; font-size: 14px; color: var(--muted); min-height: 20px; }
#status.error { color: var(--danger); }
ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
li { display: flex; gap: 12px; align-items: flex-start; }
li img { width: 64px; height: 64px; object-fit: cover; border-radius: 8px; flex: none; background: var(--line); }
.entry { flex: 1; min-width: 0; }
.entry b { display: block; }
.entry span { display: block; font-size: 14px; color: var(--muted); }
.kcal { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kcal button { display: block; min-height: 32px; padding: 0 8px; margin: 4px 0 0 auto; font-size: 13px; font-weight: 500; color: var(--muted); }
.badge { display: inline-block; font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); margin-left: 6px; vertical-align: 2px; }
.empty { color: var(--muted); font-size: 14px; margin: 0; }
.empty a { color: inherit; }
</style>
</head>
<body>
<main>
  <h1>Today</h1>
  <section class="card" aria-live="polite">
    <div class="total"><span id="kcal">0</span><small>kcal</small></div>
    <div class="bar" id="goalbar" hidden><div></div></div>
    <div class="macros"><span id="protein">Protein 0 g</span><span id="carbs">Carbs 0 g</span><span id="fat">Fat 0 g</span></div>
  </section>

  <section class="card">
    <video id="video" playsinline muted></video>
    <div class="row">
      <button class="primary" id="toggle">Start watching</button>
      <label class="file">Test with a photo<input type="file" id="photo" accept="image/*"></label>
      <label class="check"><input type="checkbox" id="speak" checked> Speak</label>
    </div>
    <p id="status">Not watching. This page uses this device's camera. Frames sent by the glasses app show up here too.</p>
  </section>

  <section class="card">
    <ul id="entries"></ul>
    <p class="empty" id="empty">Nothing logged yet today.</p>
  </section>

  <p class="empty"><a id="display" href="/display/?hold">Open the screen for display glasses</a></p>
</main>

<script>
const INTERVAL_MS = 2500;
const $ = (id) => document.getElementById(id);
const video = $("video"), statusEl = $("status"), toggle = $("toggle");

function stored(key, value) {
  try {
    if (value !== undefined) localStorage.setItem(key, value);
    return localStorage.getItem(key) || "";
  } catch { return value || ""; }
}
const token = new URLSearchParams(location.search).get("token") || stored("token");
if (token) stored("token", token);
const auth = token ? { "X-Api-Token": token } : {};
const withToken = (url) => (token ? url + "?token=" + encodeURIComponent(token) : url);
if (token) $("display").href += "&token=" + encodeURIComponent(token);

let watching = false, stream = null, lang = "en-US", wakeLock = null;

function setStatus(text, isError) {
  statusEl.textContent = text;
  statusEl.className = isError ? "error" : "";
}

function speak(text) {
  if (!text || !$("speak").checked || !("speechSynthesis" in window)) return;
  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = lang;
  speechSynthesis.speak(utterance);
}

async function api(path, options) {
  const response = await fetch(path, options);
  const body = await response.json().catch(() => ({}));
  if (!response.ok) throw new Error(body.detail || "The server returned " + response.status + ".");
  return body;
}

function render(today) {
  if (!today) return;
  lang = today.lang || lang;
  $("kcal").textContent = today.kcal;
  $("protein").textContent = "Protein " + today.protein_g + " g";
  $("carbs").textContent = "Carbs " + today.carbs_g + " g";
  $("fat").textContent = "Fat " + today.fat_g + " g";
  $("goalbar").hidden = !today.goal_kcal;
  if (today.goal_kcal) $("goalbar").firstElementChild.style.width = Math.min(100, (today.kcal / today.goal_kcal) * 100) + "%";

  const list = $("entries");
  list.replaceChildren();
  for (const entry of today.entries) {
    const li = document.createElement("li");
    const img = document.createElement("img");
    img.src = withToken("/entries/" + entry.id + "/image");
    img.alt = "";
    const text = document.createElement("div");
    text.className = "entry";
    const title = document.createElement("b");
    title.textContent = entry.title;
    if (entry.open) {
      const badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = entry.portion_left < 0.9 ? "Eating, " + Math.round(entry.portion_left * 100) + "% left" : "Eating now";
      title.append(badge);
    }
    const detail = document.createElement("span");
    detail.textContent = entry.time + " · " + entry.items.map((i) => i.name + " " + Math.round(i.grams) + " g").join(", ");
    text.append(title, detail);
    if (entry.eaten_share < 1) {
      const left = document.createElement("span");
      left.textContent = "Ate " + Math.round(entry.eaten_share * 100) + "% of " + entry.kcal_served + " kcal served";
      text.append(left);
    }
    const kcal = document.createElement("div");
    kcal.className = "kcal";
    kcal.textContent = entry.kcal + " kcal";
    const undo = document.createElement("button");
    undo.textContent = "Remove";
    undo.onclick = async () => {
      try { render(await api("/entries/" + entry.id, { method: "DELETE", headers: auth })); }
      catch (e) { setStatus(e.message, true); }
    };
    kcal.append(undo);
    li.append(img, text, kcal);
    list.append(li);
  }
  $("empty").hidden = today.entries.length > 0;
}

const SCENES = { my_food: "Your food is in view.", other_food: "Food in view, but not yours.", no_food: "No food in view." };
const EVENTS = { pending: "Food in view. Checking once more before logging.", logged: "Logged.", updated: "Watching you eat.", busy: "Still thinking about the last frame." };

async function sendFrame(blob) {
  const result = await api("/frames", { method: "POST", headers: { "Content-Type": blob.type || "image/jpeg", ...auth }, body: blob });
  speak(result.say);
  render(result.today);
  setStatus(result.say || EVENTS[result.event] || SCENES[result.scene] || "Watching.");
  return result;
}

function grab() {
  const scale = Math.min(1, 1024 / Math.max(video.videoWidth, video.videoHeight));
  const canvas = document.createElement("canvas");
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  return new Promise((resolve) => canvas.toBlob(resolve, "image/jpeg", 0.8));
}

const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

async function loop() {
  while (watching) {
    const started = performance.now();
    try {
      if (video.videoWidth) await sendFrame(await grab());
    } catch (e) {
      setStatus(e.message, true);
    }
    await sleep(Math.max(0, INTERVAL_MS - (performance.now() - started)));
  }
}

async function start() {
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    setStatus("This browser will not open the camera here. Open the page over https or on localhost.", true);
    return;
  }
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false });
  } catch (e) {
    setStatus("Could not open the camera: " + e.message, true);
    return;
  }
  video.srcObject = stream;
  video.style.display = "block";
  await video.play();
  watching = true;
  toggle.textContent = "Stop watching";
  setStatus("Watching.");
  speak(lang === "fi-FI" ? "Seuranta päällä." : "Watching.");
  try { wakeLock = await navigator.wakeLock.request("screen"); } catch { wakeLock = null; }
  loop();
}

function stop() {
  watching = false;
  if (stream) stream.getTracks().forEach((track) => track.stop());
  stream = null;
  video.style.display = "none";
  toggle.textContent = "Start watching";
  setStatus("Not watching.");
  if (wakeLock) wakeLock.release().catch(() => {});
}

toggle.onclick = () => (watching ? stop() : start());

$("photo").onchange = async (event) => {
  const file = event.target.files[0];
  event.target.value = "";
  if (!file) return;
  setStatus("Sending the photo.");
  try {
    // A new meal is logged only after it has been seen more than once, so send the same photo again while it is pending.
    for (let i = 0; i < 4; i++) {
      const result = await sendFrame(file);
      if (result.event !== "pending" && result.event !== "busy") break;
    }
  } catch (e) {
    setStatus(e.message, true);
  }
};

async function poll() {
  try { render(await api("/today", { headers: auth })); }
  catch (e) { if (!watching) setStatus(e.message, true); }
}
poll();
setInterval(poll, 4000);
</script>
</body>
</html>
