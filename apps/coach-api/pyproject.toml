[project]
name = "coach-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162.7",
    "strands-agents[anthropic,openai]>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 160

[tool.ruff.lint.per-file-ignores]
"scripts/fetch_statfin.py" = ["UP031"]
